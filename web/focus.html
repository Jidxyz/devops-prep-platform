there."}, {"id": "9.6", "capability": "What is the difference between `git stash -u` and `git stash -a`?", "title": "What is the difference between `git stash -u` and `git stash -a`", "answer": "```bash\ngit stash -u        # include untracked\ngit stash -a        # include ignored too\n```\n\nPlain `git stash` leaves untracked files in place, which surprises people — you switch branches and the new files are still sitting there."}, {"id": "9.7", "capability": "How would you explain `git stash apply` versus `git stash pop`?", "title": "How would you explain `git stash apply` versus `git stash pop`", "answer": "`pop` applies and deletes the stash; `apply` applies and keeps it. The difference bites when applying to the wrong branch: with `pop`, if the apply conflicts, the stash *is* kept — but if it applies cleanly onto the wrong branch, it's gone from the list and you have to recover it from the reflog. `apply` is safer when you're unsure; delete explicitly with `git stash drop` once you've confirmed."}, {"id": "9.8", "capability": "When can `pop` be riskier than `apply`, especially on the wrong branch?", "title": "When can `pop` be riskier than `apply`, especially on the wrong branch", "answer": "`pop` applies and deletes the stash; `apply` applies and keeps it. The difference bites when applying to the wrong branch: with `pop`, if the apply conflicts, the stash *is* kept — but if it applies cleanly onto the wrong branch, it's gone from the list and you have to recover it from the reflog. `apply` is safer when you're unsure; delete explicitly with `git stash drop` once you've confirmed."}, {"id": "9.9", "capability": "How would you explain Git garbage collection, loose objects, packed objects, and repo size?", "title": "How would you explain Git garbage collection, loose objects, packed objects, and repo size", "answer": "New objects are written individually (\"loose\"). `git gc` packs them into packfiles with delta compression and prunes unreachable objects past the reflog expiry. Runs automatically on a threshold. `git count-objects -vH` shows the breakdown. Repos bloat from committed binaries and large files — and because history is permanent, deleting the file later doesn't shrink the repo. That's what LFS and `filter-repo` address."}, {"id": "9.10", "capability": "Why can committing large binaries bloat a repo even after the file is deleted later?", "title": "Why can committing large binaries bloat a repo even after the file is deleted later", "answer": "New objects are written individually (\"loose\"). `git gc` packs them into packfiles with delta compression and prunes unreachable objects past the reflog expiry. Runs automatically on a threshold. `git count-objects -vH` shows the breakdown. Repos bloat from committed binaries and large files — and because history is permanent, deleting the file later doesn't shrink the repo. That's what LFS and `filter-repo` address."}, {"id": "9.11", "capability": "How would you use Git worktrees to work on two branches at once?", "title": "How would you use Git worktrees to work on two branches at once", "answer": "```bash\ngit worktree add ../hotfix main\ngit worktree list\ngit worktree remove ../hotfix\n```\n\nMultiple working directories from one repository, each on a different branch, sharing the object database. Much better than stashing when you need to jump to a hotfix mid-feature — no stash, no rebuild of dependencies, both checkouts remain intact. The same branch can't be checked out in two worktrees at once."}, {"id": "9.12", "capability": "Why are worktrees often better than stashing when switching to an urgent hotfix?", "title": "Why are worktrees often better than stashing when switching to an urgent hotfix", "answer": "```bash\ngit worktree add ../hotfix main\ngit worktree list\ngit worktree remove ../hotfix\n```\n\nMultiple working directories from one repository, each on a different branch, sharing the object database. Much better than stashing when you need to jump to a hotfix mid-feature — no stash, no rebuild of dependencies, both checkouts remain intact. The same branch can't be checked out in two worktrees at once."}]}, {"num": 10, "title": "Advanced / situational", "items": [{"id": "10.1", "capability": "How would you cherry-pick one commit or a range of commits?", "title": "How would you cherry-pick one commit or a range of commits", "answer": "```bash\ngit cherry-pick <sha>\ngit cherry-pick <sha1>^..<sha2>     # a range\ngit cherry-pick -n <sha>            # apply without committing\n```\n\nApplies a commit's *changes* as a new commit with a new SHA. Legitimate for backporting a fix to a release branch. Overused as a substitute for proper merging, which leads to duplicated commits and confusing history — if you're cherry-picking regularly between the same two branches, the branching strategy is wrong."}, {"id": "10.2", "capability": "When is cherry-pick a good fit, and when does regular cherry-picking suggest a bad branching strategy?", "title": "When is cherry-pick a good fit, and when does regular cherry-picking suggest a bad branching strategy", "answer": "```bash\ngit cherry-pick <sha>\ngit cherry-pick <sha1>^..<sha2>     # a range\ngit cherry-pick -n <sha>            # apply without committing\n```\n\nApplies a commit's *changes* as a new commit with a new SHA. Legitimate for backporting a fix to a release branch. Overused as a substitute for proper merging, which leads to duplicated commits and confusing history — if you're cherry-picking regularly between the same two branches, the branching strategy is wrong."}, {"id": "10.3", "capability": "How would you resolve a cherry-pick conflict and continue?", "title": "How would you resolve a cherry-pick conflict and continue", "answer": "Resolve, `git add`, `git cherry-pick --continue`. Abort with `--abort`. Conflicts here usually signal the target branch has diverged enough that the commit doesn't apply cleanly — at that point, consider whether a proper merge or a fresh fix for that branch is more honest than forcing it through."}, {"id": "10.4", "capability": "When should you abort a cherry-pick instead of forcing the commit through?", "title": "When should you abort a cherry-pick instead of forcing the commit through", "answer": "Resolve, `git add`, `git cherry-pick --continue`. Abort with `--abort`. Conflicts here usually signal the target branch has diverged enough that the commit doesn't apply cleanly — at that point, consider whether a proper merge or a fresh fix for that branch is more honest than forcing it through."}, {"id": "10.5", "capability": "How would you add, clone, and update Git submodules?", "title": "How would you add, clone, and update Git submodules", "answer": "```bash\ngit submodule add <url> path\ngit clone --recurse-submodules <url>\ngit submodule update --init --recursive\n```\n\nA submodule pins a specific commit of another repo. The pain: clones don't include them by default (people get empty directories), updates are a two-step commit dance, detached HEAD inside the submodule is the default state, and branch switching doesn't update submodule contents automatically. They work, but they demand discipline the whole team has to share."}, {"id": "10.6", "capability": "Why are Git submodules painful for teams, and what discipline do they require?", "title": "Why are Git submodules painful for teams, and what discipline do they require", "answer": "```bash\ngit submodule add <url> path\ngit clone --recurse-submodules <url>\ngit submodule update --init --recursive\n```\n\nA submodule pins a specific commit of another repo. The pain: clones don't include them by default (people get empty directories), updates are a two-step commit dance, detached HEAD inside the submodule is the default state, and branch switching doesn't update submodule contents automatically. They work, but they demand discipline the whole team has to share."}, {"id": "10.7", "capability": "How would you use Git subtree as an alternative to submodules?", "title": "How would you use Git subtree as an alternative to submodules", "answer": "```bash\ngit subtree add --prefix=lib/thing <url> main --squash\ngit subtree pull --prefix=lib/thing <url> main --squash\n```\n\nVendors the other repo's content directly into yours. Better than submodules when consumers shouldn't have to know: a plain clone just works, no extra commands, no detached HEAD. Worse when you frequently push changes back upstream, and it inflates repo size. Rule of thumb: subtree for consuming, submodule for tight bidirectional development."}, {"id": "10.8", "capability": "When is subtree better than submodules, and what cost does it introduce?", "title": "When is subtree better than submodules, and what cost does it introduce", "answer": "```bash\ngit subtree add --prefix=lib/thing <url> main --squash\ngit subtree pull --prefix=lib/thing <url> main --squash\n```\n\nVendors the other repo's content directly into yours. Better than submodules when consumers shouldn't have to know: a plain clone just works, no extra commands, no detached HEAD. Worse when you frequently push changes back upstream, and it inflates repo size. Rule of thumb: subtree for consuming, submodule for tight bidirectional development."}, {"id": "10.9", "capability": "How would you write a client-side Git hook such as `pre-commit` or `commit-msg`?", "title": "How would you write a client-side Git hook such as `pre-commit` or `commit-msg`", "answer": "Scripts in `.git/hooks/`, executable, named for the event. `pre-commit` (lint, format, block secrets — exit non-zero to abort), `commit-msg` (validate message format), `pre-push` (run tests). They're local and not committed, so they can't be relied on for enforcement — and `--no-verify` skips them."}, {"id": "10.10", "capability": "Why can client-side hooks help developers but not fully enforce policy?", "title": "Why can client-side hooks help developers but not fully enforce policy", "answer": "Scripts in `.git/hooks/`, executable, named for the event. `pre-commit` (lint, format, block secrets — exit non-zero to abort), `commit-msg` (validate message format), `pre-push` (run tests). They're local and not committed, so they can't be relied on for enforcement — and `--no-verify` skips them."}, {"id": "10.11", "capability": "How would you set up the pre-commit framework across a team?", "title": "How would you set up the pre-commit framework across a team", "answer": "`.pre-commit-config.yaml` in the repo defines hooks and versions; each developer runs `pre-commit install` once. Solves the distribution problem that raw `.git/hooks` has. Still bypassable with `--no-verify`, so the same checks must also run in CI — hooks are a fast-feedback convenience, not a control."}, {"id": "10.12", "capability": "Why should the same checks run in CI even if developers use pre-commit locally?", "title": "Why should the same checks run in CI even if developers use pre-commit locally", "answer": "`.pre-commit-config.yaml` in the repo defines hooks and versions; each developer runs `pre-commit install` once. Solves the distribution problem that raw `.git/hooks` has. Still bypassable with `--no-verify`, so the same checks must also run in CI — hooks are a fast-feedback convenience, not a control."}, {"id": "10.13", "capability": "How would you explain what server-side hooks can enforce that client-side hooks cannot?", "title": "How would you explain what server-side hooks can enforce that client-side hooks cannot", "answer": "Run on the remote, so they can't be bypassed by the client. `pre-receive` can reject a push outright — enforce commit signing, message format, file size limits, or block direct pushes to main. That's the enforcement a client-side hook can never provide. On managed platforms you don't get raw server hooks; the equivalents are branch protection rules, required status checks, and push rulesets."}, {"id": "10.14", "capability": "How do branch protection rules and required checks replace raw server hooks on hosted Git platforms?", "title": "How do branch protection rules and required checks replace raw server hooks on hosted Git platforms", "answer": "Run on the remote, so they can't be bypassed by the client. `pre-receive` can reject a push outright — enforce commit signing, message format, file size limits, or block direct pushes to main. That's the enforcement a client-side hook can never provide. On managed platforms you don't get raw server hooks; the equivalents are branch protection rules, required status checks, and push rulesets."}, {"id": "10.15", "capability": "How would you enforce conventional commits and generate a changelog from them?", "title": "How would you enforce conventional commits and generate a changelog from them", "answer": "Format: `type(scope): description` — `feat`, `fix`, `chore`, `docs`, `refactor`, with `BREAKING CHANGE:` in the footer. Enforce with commitlint in a `commit-msg` hook plus a CI check. Tools like semantic-release then derive the version bump (feat → minor, fix → patch, breaking → major) and generate the changelog automatically. The value is machine-readable history; the cost is friction, so it's worth it mainly where you publish versioned artifacts."}, {"id": "10.16", "capability": "When is conventional commit discipline worth the extra friction?", "title": "When is conventional commit discipline worth the extra friction", "answer": "Format: `type(scope): description` — `feat`, `fix`, `chore`, `docs`, `refactor`, with `BREAKING CHANGE:` in the footer. Enforce with commitlint in a `commit-msg` hook plus a CI check. Tools like semantic-release then derive the version bump (feat → minor, fix → patch, breaking → major) and generate the changelog automatically. The value is machine-readable history; the cost is friction, so it's worth it mainly where you publish versioned artifacts."}, {"id": "10.17", "capability": "How would you use `git filter-repo` for history rewriting?", "title": "How would you use `git filter-repo` for history rewriting", "answer": "`git filter-branch` is officially discouraged: extremely slow, and its default behaviour is subtly unsafe in ways that produce corrupted results. `git-filter-repo` is the recommended replacement — orders of magnitude faster, safer defaults, and it forces a fresh clone so you can't half-rewrite a repo in place. Use it for removing files, purging secrets, splitting a repo, or rewriting author details."}, {"id": "10.18", "capability": "Why is `git filter-repo` preferred over `git filter-branch`?", "title": "Why is `git filter-repo` preferred over `git filter-branch`", "answer": "`git filter-branch` is officially discouraged: extremely slow, and its default behaviour is subtly unsafe in ways that produce corrupted results. `git-filter-repo` is the recommended replacement — orders of magnitude faster, safer defaults, and it forces a fresh clone so you can't half-rewrite a repo in place. Use it for removing files, purging secrets, splitting a repo, or rewriting author details."}, {"id": "10.19", "capability": "How would you explain how Git stores history efficiently with objects, packfiles, and deltas?", "title": "How would you explain how Git stores history efficiently with objects, packfiles, and deltas", "answer": "Content-addressed storage means identical content is stored once regardless of how many commits or branches reference it. Objects start loose, then `gc` packs them into packfiles using delta compression — storing similar objects as deltas against each other, chosen heuristically by size and name similarity rather than by commit order. Packfiles are further zlib-compressed. This is why a repo with long history can be surprisingly small, and why a few committed binaries (which don't delta well) can make it surprisingly large."}, {"id": "10.20", "capability": "Why can Git history stay small for text changes but grow quickly with binary files?", "title": "Why can Git history stay small for text changes but grow quickly with binary files", "answer": "Content-addressed storage means identical content is stored once regardless of how many commits or branches reference it. Objects start loose, then `gc` packs them into packfiles using delta compression — storing similar objects as deltas against each other, chosen heuristically by size and name similarity rather than by commit order. Packfiles are further zlib-compressed. This is why a repo with long history can be surprisingly small, and why a few committed binaries (which don't delta well) can make it surprisingly large."}]}]}</script>
<script>
(function(){
'use strict';

const byId = Object.fromEntries(ALL.map(i => [i.id, i]));

let S = {scores:{}, off:[], done:0};
try{ const p = JSON.parse(localStorage.getItem(KEY)); if(p) S = {...S, ...p}; }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const off = () => new Set(S.off);
const sc = id => id in S.scores ? S.scores[id] : -1;
const pool = () => ALL.filter(i => !off().has(i.sec));

/* ---------- markdown ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(t){
  return esc(t)
    .replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const blocks=[];
  src = src.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>{
    blocks.push('<pre><code>'+esc(c.replace(/\n$/,''))+'</code></pre>');
    return '\u0000'+(blocks.length-1)+'\u0000';
  });
  const out=[], L=src.split('\n'); let i=0;
  const ul=/^\s*[-*]\s+/, ol=/^\s*\d+\.\s+/;
  while(i<L.length){
    const ln=L[i];
    if(/^\u0000\d+\u0000$/.test(ln.trim())){ out.push(blocks[+ln.trim().replace(/\u0000/g,'')]); i++; continue; }
    if(!ln.trim()){ i++; continue; }
    if(/^#{1,6}\s/.test(ln)){ out.push('<h4>'+inline(ln.replace(/^#+\s*/,''))+'</h4>'); i++; continue; }
    if(/^(---+|\*\*\*+)$/.test(ln.trim())){ out.push('<hr>'); i++; continue; }
    if(ln.trim().startsWith('|') && L[i+1] && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let h='<table><thead><tr>'+cells(ln).map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      i+=2;
      while(i<L.length && L[i].trim().startsWith('|')){
        h+='<tr>'+cells(L[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; i++;
      }
      out.push(h+'</tbody></table>'); continue;
    }
    if(/^>\s?/.test(ln)){
      const b=[]; while(i<L.length && /^>\s?/.test(L[i])){ b.push(L[i].replace(/^>\s?/,'')); i++; }
      out.push('<blockquote>'+md(b.join('\n'))+'</blockquote>'); continue;
    }
    if(ul.test(ln)||ol.test(ln)){
      const ord=ol.test(ln)&&!ul.test(ln), re=ord?ol:ul;
      let h=ord?'<ol>':'<ul>';
      while(i<L.length && re.test(L[i])){
        let t=L[i].replace(re,''); i++;
        while(i<L.length && L[i].trim() && !ul.test(L[i]) && !ol.test(L[i])
              && !L[i].trim().startsWith('|') && !/^#{1,6}\s/.test(L[i])){ t+=' '+L[i].trim(); i++; }
        h+='<li>'+inline(t)+'</li>';
      }
      out.push(h+(ord?'</ol>':'</ul>')); continue;
    }
    const b=[];
    while(i<L.length && L[i].trim() && !/^[-*>#|]/.test(L[i].trim())
          && !/^\u0000/.test(L[i].trim()) && !ol.test(L[i])){ b.push(L[i].trim()); i++; }
    if(b.length) out.push('<p>'+inline(b.join(' '))+'</p>');
    else { out.push('<p>'+inline(L[i])+'</p>'); i++; }
  }
  return out.join('');
}

/* ---------- session ---------- */
let ses = null;
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

function build(size, mode){
  let p = pool();
  if(mode === 'weak') p = p.filter(i => sc(i.id) === 0 || sc(i.id) === 1);
  else {
    // default: never-seen first, then gaps, then shaky, then solid
    const rank = i => { const s = sc(i.id); return s === -1 ? 0 : s === 0 ? 1 : s === 1 ? 2 : 3; };
    p = shuffle(p.slice()).sort((a,b) => rank(a) - rank(b));
  }
  if(mode === 'weak') p = shuffle(p);
  return p.slice(0, size === 'all' ? p.length : Math.min(size, p.length));
}

function start(size, mode){
  const cards = build(size, mode);
  if(!cards.length){ home(); return; }
  ses = {cards, i:0, shown:false, results:[], before:Object.assign({}, S.scores)};
  document.getElementById('track').classList.remove('hide');
  document.getElementById('main').classList.add('insession');
  card();
}
function endSession(){
  ses = null;
  document.getElementById('track').classList.add('hide');
  document.getElementById('main').classList.remove('insession');
  home();
}

function drawTrack(){
  document.getElementById('segs').innerHTML = ses.cards.map((c,n)=>{
    const r = ses.results[n];
    return `<i class="seg ${n===ses.i?'now':''} ${r!=null?'s'+r:''}"></i>`;
  }).join('');
  document.getElementById('tcount').innerHTML = `<b>${ses.i+1}</b>/${ses.cards.length}`;
}

const LAST = {0:'was a gap',1:'was shaky',2:'was solid'};
function card(){
  drawTrack();
  const c = ses.cards[ses.i], prev = sc(c.id);
  document.getElementById('main').innerHTML = `
    <div class="stage">
      <div class="card">
        <div class="cmeta">
          <span class="cid">${c.id}</span>
          <span class="csec">${esc(c.secName)}</span>
          ${prev>-1?`<span class="clast s${prev}">${LAST[prev]}</span>`:''}
        </div>
        <h2 class="q">${esc(c.capability)}</h2>
        <p class="prompt">Say your answer out loud, then check it.</p>
        ${ses.shown ? `<div class="answer">${md(c.answer)}</div>` : `
        <button class="reveal" id="rev">Show the answer
          <small>SPACE</small></button>`}
      </div>
      ${ses.shown ? `
      <div class="rate">
        <p>How did that go?</p>
        <div class="rbtns">
          <button class="rb r0" data-r="0">No idea <kbd>1</kbd></button>
          <button class="rb r1" data-r="1">Roughly <kbd>2</kbd></button>
          <button class="rb r2" data-r="2">Nailed it <kbd>3</kbd></button>
        </div>
      </div>` : `<button class="skip" id="skip">Skip this one</button>`}
    </div>`;
  const r = document.getElementById('rev'); if(r) r.focus();
}

function rate(v){
  const c = ses.cards[ses.i];
  S.scores[c.id] = v; S.done++;
  ses.results[ses.i] = v;
  save();
  next();
}
function next(){
  ses.i++; ses.shown = false;
  if(ses.i >= ses.cards.length) finish(); else card();
}
function finish(){
  const r = ses.results.filter(x=>x!=null);
  const nailed = r.filter(x=>x===2).length;
  const improved = ses.cards.filter((c,n)=>{
    const b = ses.before[c.id]; const a = S.scores[c.id];
    return a!=null && (b==null || a>b);
  }).length;
  document.getElementById('track').classList.add('hide');
  document.getElementById('main').classList.remove('insession');
  const mood = nailed === r.length && r.length ? ['\u{1F3AF}','Clean sweep']
    : nailed >= r.length*0.6 ? ['\u{1F525}','Strong run']
    : ['\u{1F4AA}','Session done'];
  document.getElementById('main').innerHTML = `
    <div class="done">
      <div class="burst">${mood[0]}</div>
      <h2>${mood[1]}</h2>
      <p class="lede">${nailed} of ${r.length} nailed. That's ${r.length} more than you'd have done by not starting.</p>
      ${improved?`<div class="moved">\u2191 ${improved} item${improved>1?'s':''} moved up</div>`:''}
      <div class="again">
        <button class="alt" data-go="10"><b>Go again</b> \u00b7 10 cards</button>
        <button class="alt" data-go="weak">Just my weak spots</button>
        <button class="alt" data-go="home">Back to overview</button>
      </div>
    </div>`;
  ses = null;
}

/* ---------- home ---------- */
function home(){
  const p = pool();
  const n = {u:0,0:0,1:0,2:0};
  p.forEach(i=>{ const s=sc(i.id); s===-1?n.u++:n[s]++; });
  const pts = p.reduce((a,i)=>a+Math.max(0,sc(i.id)),0);
  const pct = p.length ? Math.round(pts/(p.length*2)*100) : 0;
  const weak = n[0]+n[1];
  const next10 = Math.min(10, p.length);

  document.getElementById('main').innerHTML = `
    <div class="hero">
      <p class="eyebrow">Git \u00b7 ${p.length} capabilities in play</p>
      <h1>${n.u ? 'Pick up where you left off.' : weak ? 'Close the gaps.' : 'Keep it sharp.'}</h1>
      <p>One card at a time. Answer out loud, check yourself, move on.</p>
    </div>

    <button class="go" data-go="10">
      Start ${next10} cards <span class="n">~${Math.max(3,Math.round(next10*0.7))} min</span>
    </button>

    <div class="alts">
      <button class="alt" data-go="20"><b>20</b> cards</button>
      ${weak?`<button class="alt" data-go="weak">Weak spots <b>${weak}</b></button>`:''}
      <button class="alt" data-go="all">Everything <b>${p.length}</b></button>
    </div>

    <div class="mastery">
      <div class="top"><h3>Where you stand</h3><span class="pct">${pct}% \u00b7 ${pts}/${p.length*2}</span></div>
      <div class="mbar">
        <i class="a" style="width:${n[2]/p.length*100}%"></i>
        <i class="b" style="width:${n[1]/p.length*100}%"></i>
        <i class="c" style="width:${n[0]/p.length*100}%"></i>
      </div>
    </div>

    <div class="stats">
      <div class="stat s"><div class="v">${n[2]}</div><div class="k">Solid</div></div>
      <div class="stat m"><div class="v">${n[1]}</div><div class="k">Shaky</div></div>
      <div class="stat g"><div class="v">${n[0]}</div><div class="k">Gaps</div></div>
      <div class="stat"><div class="v">${n.u}</div><div class="k">Untouched</div></div>
    </div>

    <div class="secs">
      ${DATA.sections.map(s=>{
        const isOff = off().has(s.num);
        const c = {0:0,1:0,2:0};
        s.items.forEach(i=>{ const v=sc(i.id); if(v>-1) c[v]++; });
        const t = s.items.length;
        return `<button class="srow ${isOff?'off':''}" data-sec="${s.num}">
          <span class="stick">${isOff?'':'\u2713'}</span>
          <span class="sname">${esc(s.title)}</span>
          <span class="sbar">
            <i style="width:${c[2]/t*100}%;background:var(--solid)"></i>
            <i style="width:${c[1]/t*100}%;background:var(--mid)"></i>
            <i style="width:${c[0]/t*100}%;background:var(--gap)"></i>
          </span>
          <span class="sn">${c[0]+c[1]+c[2]}/${t}</span>
        </button>`;
      }).join('')}
    </div>

    <div class="alts">
      <button class="alt" id="exp">Export scores</button>
      <button class="alt" id="imp">Import</button>
    </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]');
  if(go){
    const v = go.dataset.go;
    if(v === 'home') home();
    else if(v === 'weak') start('all','weak');
    else if(v === 'all') start('all','order');
    else start(+v,'order');
    window.scrollTo(0,0); return;
  }
  if(e.target.closest('#rev')){ ses.shown = true; card(); window.scrollTo(0,0); return; }
  if(e.target.closest('#skip')){ next(); window.scrollTo(0,0); return; }
  const r = e.target.closest('[data-r]');
  if(r){ rate(+r.dataset.r); window.scrollTo(0,0); return; }
  const sec = e.target.closest('[data-sec]');
  if(sec){
    const k = +sec.dataset.sec, o = off();
    o.has(k) ? o.delete(k) : o.add(k);
    if(o.size === DATA.sections.length) o.delete(k);   // never allow zero
    S.off = [...o]; save(); home(); return;
  }
  if(e.target.closest('#quit')){ endSession(); return; }
  if(e.target.closest('#exp')){
    const b = new Blob([JSON.stringify({saved:new Date().toISOString(),scores:S.scores},null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'drill-scores.json'; a.click(); URL.revokeObjectURL(a.href); return;
  }
  if(e.target.closest('#imp')){
    const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
    inp.onchange = ()=>{ const fr = new FileReader();
      fr.onload = ()=>{ try{ const d = JSON.parse(fr.result); S.scores = d.scores || d; save(); home(); }
        catch(err){ alert('That file could not be read as saved scores.'); } };
      fr.readAsText(inp.files[0]); };
    inp.click();
  }
});

document.addEventListener('keydown', e=>{
  if(!ses) return;
  if(e.key === 'Escape'){ endSession(); return; }
  if(!ses.shown && (e.key === ' ' || e.key === 'Enter')){
    e.preventDefault(); ses.shown = true; card(); window.scrollTo(0,0); return;
  }
  if(ses.shown && ['1','2','3'].includes(e.key)){
    e.preventDefault(); rate(+e.key - 1); window.scrollTo(0,0);
  }
});

home();
})();
</script>
</body>
</html>
