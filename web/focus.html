<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drill — one card at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17122a; --bg2:#1e1836; --card:#272049; --card2:#2f2755;
  --ink:#f4f0fb; --dim:#a99fc4; --faint:#6f6591;
  --gap:#ff6b8a; --mid:#ffb23f; --solid:#4fddb0; --spark:#c8a4ff;
  --sans:'Bricolage Grotesque',system-ui,sans-serif;
  --serif:'Literata',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,.84,.44,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--spark);outline-offset:3px;border-radius:4px}
.hide{display:none!important}

/* ============ SESSION TRACK — the signature ============ */
#track{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--bg);
  border-bottom:1px solid #322a56;padding:11px 20px;
  display:flex;align-items:center;gap:16px}
.segs{display:flex;gap:3px;flex:1;min-width:0}
.seg{flex:1;height:7px;border-radius:99px;background:#332b59;transition:background .35s var(--ease),transform .35s var(--ease)}
.seg.now{background:var(--spark);transform:scaleY(1.9)}
.seg.s0{background:var(--gap)} .seg.s1{background:var(--mid)} .seg.s2{background:var(--solid)}
.tcount{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.tcount b{color:var(--ink)}
.tx{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;
  text-transform:uppercase;padding:5px 9px;border-radius:6px}
.tx:hover{color:var(--ink);background:var(--card)}

/* ============ shell ============ */
main{max-width:760px;margin:0 auto;padding:24px 20px 90px;min-height:100vh}
main.insession{padding-top:66px}

/* ============ HOME ============ */
.hero{padding:52px 0 30px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--spark);margin:0 0 14px}
.hero h1{font-size:clamp(34px,7vw,52px);line-height:1.02;letter-spacing:-.03em;
  font-weight:800;margin:0 0 16px}
.hero p{font-family:var(--serif);font-size:17px;color:var(--dim);margin:0;max-width:44ch}

.go{display:block;width:100%;background:var(--spark);color:#1a1030;
  font-size:19px;font-weight:700;letter-spacing:-.01em;padding:21px 24px;border-radius:15px;
  margin:30px 0 13px;text-align:left;display:flex;align-items:center;gap:14px;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
  box-shadow:0 5px 0 #9a72d8}
.go:hover{transform:translateY(-2px);box-shadow:0 7px 0 #9a72d8}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #9a72d8}
.go .n{font-family:var(--mono);font-size:12px;background:#1a1030;color:var(--spark);
  padding:4px 9px;border-radius:99px;margin-left:auto}

.alts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px}
.alt{border:1px solid #3a3163;border-radius:11px;padding:11px 15px;font-size:14px;color:var(--dim);
  transition:border-color .16s,color .16s}
.alt:hover{border-color:var(--spark);color:var(--ink)}
.alt b{color:var(--ink);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--bg2);border-radius:13px;padding:15px 16px}
.stat .v{font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--faint);margin-top:6px}
.stat.g .v{color:var(--gap)} .stat.m .v{color:var(--mid)} .stat.s .v{color:var(--solid)}

.mastery{background:var(--bg2);border-radius:13px;padding:17px 18px;margin-bottom:14px}
.mastery .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.mastery h3{margin:0;font-size:14px;font-weight:700}
.mastery .pct{font-family:var(--mono);font-size:12px;color:var(--dim)}
.mbar{height:11px;border-radius:99px;background:#332b59;overflow:hidden;display:flex}
.mbar i{height:100%;transition:width .6s var(--ease)}
.mbar .a{background:var(--solid)} .mbar .b{background:var(--mid)} .mbar .c{background:var(--gap)}

/* section breakdown */
.secs{display:flex;flex-direction:column;gap:1px;background:var(--bg2);border-radius:13px;
  overflow:hidden;margin-bottom:14px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--bg2);
  text-align:left;width:100%;transition:background .14s}
.srow:hover{background:var(--card)}
.srow.off{opacity:.36}
.sname{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{width:74px;height:6px;border-radius:99px;background:#332b59;overflow:hidden;display:flex;flex:none}
.sbar i{height:100%}
.sn{font-family:var(--mono);font-size:10px;color:var(--faint);width:38px;text-align:right;flex:none}
.stick{width:15px;height:15px;border-radius:5px;border:1.5px solid #4a3f7a;flex:none;
  display:grid;place-items:center;font-size:9px;color:var(--bg)}
.srow:not(.off) .stick{background:var(--spark);border-color:var(--spark)}

/* ============ CARD ============ */
.stage{padding-top:18px;animation:rise .34s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:19px;padding:28px 28px 26px;
  box-shadow:0 16px 44px -18px rgba(0,0,0,.62)}
.cmeta{display:flex;align-items:center;gap:9px;margin-bottom:17px}
.cid{font-family:var(--mono);font-size:11px;color:var(--spark);background:#1a1030;
  padding:4px 9px;border-radius:6px;font-weight:700}
.csec{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em}
.clast{margin-left:auto;font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:99px}
.clast.s0{color:var(--gap);background:rgba(255,107,138,.13)}
.clast.s1{color:var(--mid);background:rgba(255,178,63,.13)}
.clast.s2{color:var(--solid);background:rgba(79,221,176,.13)}
.q{font-size:clamp(21px,3.6vw,27px);line-height:1.28;font-weight:700;letter-spacing:-.02em;margin:0}
.prompt{font-family:var(--serif);font-size:14.5px;color:var(--dim);margin:15px 0 0;font-style:italic}

.reveal{width:100%;margin-top:24px;background:transparent;border:1.5px dashed #4a3f7a;
  border-radius:13px;padding:17px;font-size:15px;font-weight:700;color:var(--dim);
  transition:border-color .16s,color .16s,background .16s}
.reveal:hover{border-color:var(--spark);color:var(--ink);background:rgba(200,164,255,.06)}
.reveal small{display:block;font-family:var(--mono);font-size:10px;font-weight:400;
  color:var(--faint);margin-top:5px;letter-spacing:.05em}

.answer{margin-top:22px;padding-top:21px;border-top:1px solid #3a3163;
  font-family:var(--serif);font-size:16px;line-height:1.68;color:#e6dff5;
  animation:unfold .4s var(--ease)}
@keyframes unfold{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}

/* scoring */
.rate{margin-top:22px;animation:rise .3s var(--ease) .05s backwards}
.rate p{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--faint);margin:0 0 10px}
.rbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.rb{border-radius:13px;padding:15px 11px;font-size:14.5px;font-weight:700;border:1.5px solid;
  transition:transform .15s var(--ease),background .15s;display:flex;flex-direction:column;
  align-items:center;gap:5px;line-height:1.2}
.rb kbd{font-family:var(--mono);font-size:9px;font-weight:400;opacity:.6}
.rb:hover{transform:translateY(-2px)}
.rb.r0{color:var(--gap);border-color:rgba(255,107,138,.4)}
.rb.r0:hover{background:rgba(255,107,138,.15)}
.rb.r1{color:var(--mid);border-color:rgba(255,178,63,.4)}
.rb.r1:hover{background:rgba(255,178,63,.15)}
.rb.r2{color:var(--solid);border-color:rgba(79,221,176,.4)}
.rb.r2:hover{background:rgba(79,221,176,.15)}

.skip{display:block;margin:15px auto 0;font-family:var(--mono);font-size:11px;
  color:var(--faint);letter-spacing:.06em;padding:7px 12px;border-radius:7px}
.skip:hover{color:var(--dim);background:var(--bg2)}

/* ============ DONE ============ */
.done{text-align:center;padding:44px 0 20px;animation:rise .4s var(--ease)}
.burst{font-size:60px;line-height:1;margin-bottom:14px;animation:pop .55s var(--ease)}
@keyframes pop{0%{transform:scale(.3);opacity:0}62%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
.done h2{font-size:33px;font-weight:800;letter-spacing:-.03em;margin:0 0 9px}
.done .lede{font-family:var(--serif);color:var(--dim);margin:0 0 28px;font-size:16.5px}
.moved{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;
  background:rgba(79,221,176,.12);color:var(--solid);padding:8px 14px;border-radius:99px;margin-bottom:26px}
.again{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* ============ markdown ============ */
.answer h4{font-family:var(--sans);font-size:14px;font-weight:700;margin:20px 0 8px;color:var(--ink)}
.answer p{margin:12px 0}
.answer ul,.answer ol{margin:12px 0;padding-left:20px}
.answer li{margin:7px 0}
.answer li::marker{color:var(--spark)}
.answer strong{color:#fff;font-weight:600}
.answer code{font-family:var(--mono);font-size:.84em;background:#1a1030;color:var(--spark);
  border-radius:4px;padding:.1em .36em}
.answer pre{background:#120e22;border:1px solid #322a56;border-radius:11px;padding:15px 17px;
  overflow-x:auto;margin:15px 0;font-size:12.5px;line-height:1.6}
.answer pre code{background:none;padding:0;color:#d9d2ee;font-size:inherit}
.answer blockquote{margin:15px 0;padding:3px 0 3px 16px;border-left:2px solid var(--spark);color:var(--dim)}
.answer table{border-collapse:collapse;width:100%;margin:15px 0;font-family:var(--sans);font-size:13.5px}
.answer th,.answer td{border:1px solid #3a3163;padding:8px 11px;text-align:left;vertical-align:top}
.answer th{background:#1a1030;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--dim);font-weight:700}
.answer hr{border:none;border-top:1px solid #3a3163;margin:20px 0}
.answer a{color:var(--spark)}

@media (max-width:560px){
  .card{padding:22px 19px}
  .rbtns{grid-template-columns:1fr;gap:7px}
  .rb{flex-direction:row;justify-content:center;gap:9px;padding:13px}
  .hero{padding:32px 0 22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="track" class="hide">
  <div class="segs" id="segs"></div>
  <span class="tcount" id="tcount"></span>
  <button class="tx" id="quit">End</button>
</div>

<main id="main"></main>

ere a value came from with `git config --list --show-origin`, which is the fastest way to answer \"why is this repo using the wrong email\"."}, {"id": "1.4", "capability": "When a repository is using an unexpected Git setting, how would you find which config file is winning?", "title": "When a repository is using an unexpected Git setting, how would you find which config file is winning", "answer": "Three levels, narrowest wins: `--system` (all users, `/etc/gitconfig`), `--global` (your user, `~/.gitconfig`), `--local` (this repo, `.git/config`). There's also `--worktree`. Check where a value came from with `git config --list --show-origin`, which is the fastest way to answer \"why is this repo using the wrong email\"."}, {"id": "1.5", "capability": "How would you create useful Git aliases for everyday work?", "title": "How would you create useful Git aliases for everyday work", "answer": "```bash\ngit config --global alias.lg \"log --oneline --graph --decorate --all\"\ngit config --global alias.st \"status -sb\"\n```\n\nShell commands need a `!` prefix: `alias.cleanup = '!git branch --merged | grep -v main | xargs git branch -d'`."}, {"id": "1.6", "capability": "What makes a Git alias helpful, and when would you use a shell alias with the `!` prefix?", "title": "What makes a Git alias helpful, and when would you use a shell alias with the `!` prefix", "answer": "```bash\ngit config --global alias.lg \"log --oneline --graph --decorate --all\"\ngit config --global alias.st \"status -sb\"\n```\n\nShell commands need a `!` prefix: `alias.cleanup = '!git branch --merged | grep -v main | xargs git branch -d'`."}, {"id": "1.7", "capability": "How would you set up SSH authentication for GitHub or another Git host?", "title": "How would you set up SSH authentication for GitHub or another Git host", "answer": "Generate with `ssh-keygen -t ed25519 -C \"label\"`, add the public key to the host, test with `ssh -T git@github.com`. Rotation: generate the new key, add it, verify i e and confirm it is working", "answer": "`.gitignore` only affects *untracked* files. Once a file is tracked, ignoring it does nothing. Fix:\n\n```bash\ngit rm --cached path/to/file\n```\n\nthen commit. `--cached` removes it from the index but leaves it on disk. Use `git check-ignore -v <path>` to find which rule (or which file) is matching. Note precedence: repo `.gitignore`, then `.git/info/exclude` for local-only ignores, then the global ignore file."}, {"id": "1.12", "capability": "Why does a file keep appearing in Git after you added it to `.gitignore`, and how would you fix it?", "title": "Why does a file keep appearing in Git after you added it to `.gitignore`, and how would you fix it", "answer": "`.gitignore` only affects *untracked* files. Once a file is tracked, ignoring it does nothing. Fix:\n\n```bash\ngit rm --cached path/to/file\n```\n\nthen commit. `--cached` removes it from the index but leaves it on disk. Use `git check-ignore -v <path>` to find which rule (or which file) is matching. Note precedence: repo `.gitignore`, then `.git/info/exclude` for local-only ignores, then the global ignore file."}, {"id": "1.13", "capability": "How would you use `.gitattributes` for line endings, binary files, diff drivers, or LFS?", "title": "How would you use `.gitattributes` for line endings, binary files, diff drivers, or LFS", "answer": "Controls per-path behaviour. Most common use is line endings: `* text=auto` normalises to LF in the repo. Also marks binaries (`*.png binary`) so Git doesn't try to diff them, sets custom diff drivers, marks generated files with `linguist-generated`, and configures `merge=ours` for files like changelogs. Unlike `.gitignore`, it's committed and applies to everyone, which is the point."}, {"id": "1.14", "capability": "When should a rule live in `.gitattributes` instead of `.gitignore`?", "title": "When should a rule live in `.gitattributes` instead of `.gitignore`", "answer": "Controls per-path behaviour. Most common use is line endings: `* text=auto` normalises to LF in the repo. Also marks binaries (`*.png binary`) so Git doesn't try to diff them, sets custom diff drivers, marks generated files with `linguist-generated`, and configures `merge=ours` for files like changelogs. Unlike `.gitignore`, it's committed and applies to everyone, which is the point."}, {"id": "1.15", "capability": "How would you set up Git LFS for large binary assets?", "title": "How would you set up Git LFS for large binary assets", "answer": "Replaces large files with pointer files, storing the real content on a separate server. Warranted for binaries that change often — design assets, ML models, media. Not warranted for large files that never change (the delta cost is low anyway) and it adds a hard dependency: without the LFS client, a clone gives you pointer text instead of files. Track with `git lfs track \"*.psd\"`, which writes to `.gitattributes`."}, {"id": "1.16", "capability": "When is Git LFS worth using, and what tradeoffs does it introduce for clones and contributors?", "title": "When is Git LFS worth using, and what tradeoffs does it introduce for clones and contributors", "answer": "Replaces large files with pointer files, storing the real content on a separate server. Warranted for binaries that change often — design assets, ML models, media. Not warranted for large files that never change (the delta cost is low anyway) and it adds a hard dependency: without the LFS client, a clone gives you pointer text instead of files. Track with `git lfs track \"*.psd\"`, which writes to `.gitattributes`."}]}, {"num": 2, "title": "Core workflow", "items": [{"id": "2.1", "capability": "How would you explain the working directory, index, and HEAD in Git?", "title": "How would you explain the working directory, index, and HEAD in Git", "answer": "- **Working directory** — the files on disk, what you're editing.\n- **Index (staging area)** — a snapshot you're building for the next commit. `git add` copies from working directory to index.\n- **HEAD** — a pointer to the commit at the tip of the current branch; the last committed state.\n\n`git diff` compares working directory to index. `git diff --staged` compares index to HEAD. `git status` describes both gaps. The index existing as a separate layer is what makes partial staging possible."}, {"id": "2.2", "capability": "Which Git diff commands would you use to prove what is unstaged, staged, and committed?", "title": "Which Git diff commands would you use to prove what is unstaged, staged, and committed", "answer": "- **Working directory** — the files on disk, what you're editing.\n- **Index (staging area)** — a snapshot you're building for the next commit. `git add` copies from working directory to index.\n- **HEAD** — a pointer to the commit at the tip of the current branch; the last committed state.\n\n`git diff` compares working directory to index. `git diff --staged` compares index to HEAD. `git status` describes both gaps. The index existing as a separate layer is what makes partial staging possible."}, {"id": "2.3", "capability": "How would you use `git add -p` to stage only part of a file?", "title": "How would you use `git add -p` to stage only part of a file", "answer": "Interactively stage individual hunks. Prompts per hunk: `y` stage, `n` skip, `s` split into smaller hunks, `e` edit the hunk manually, `q` quit. Use it to split unrelated changes in one file into separate commits. `git add -p` is the single highest-value habit for producing reviewable commits."}, {"id": "2.4", "capability": "Why is partial staging useful when preparing clean commits for review?", "title": "Why is partial staging useful when preparing clean commits for review", "answer": "Interactively stage individual hunks. Prompts per hunk: `y` stage, `n` skip, `s` split into smaller hunks, `e` edit the hunk manually, `q` quit. Use it to split unrelated changes in one file into separate commits. `git add -p` is the single highest-value habit for producing reviewable commits."}, {"id": "2.5", "capability": "How would you unstage a file without losing your local changes?", "title": "How would you unstage a file without losing your local changes", "answer": "```bash\ngit restore --staged <file>    # modern\ngit reset HEAD <file>          # older equivalent\n```\n\nBoth move the change back to unstaged; the file on disk is untouched. Note `git restore <file>` *without* `--staged` discards working-directory changes — different and destructive."}, {"id": "2.6", "capability": "What is the difference between `git restore --staged <file>` and `git restore <file>`?", "title": "What is the difference between `git restore --staged <file>` and `git restore <file>`", "answer": "```bash\ngit restore --staged <file>    # modern\ngit reset HEAD <file>          # older equivalent\n```\n\nBoth move the change back to unstaged; the file on disk is untouched. Note `git restore <file>` *without* `--staged` discards working-directory changes — different and destructive."}, {"id": "2.7", "capability": "What makes a Git commit message clear and useful?", "title": "What makes a Git commit message clear and useful", "answer": "Subject line under ~50 chars, imperative mood (\"Add retry to webhook handler\", not \"Added\" or \"Adds\"), blank line, then a body explaining *why*. The diff already shows what changed; the message exists to explain the reasoning that isn't recoverable from the code. Reference the issue. A commit should be one logical change — if the message needs \"and\", it's probably two commits."}, {"id": "2.8", "capability": "How would you decide whether one set of changes should be one commit or several commits?", "title": "How would you decide whether one set of changes should be one commit or several commits", "answer": "Subject line under ~50 chars, imperative mood (\"Add retry to webhook handler\", not \"Added\" or \"Adds\"), blank line, then a body explaining *why*. The diff already shows what changed; the message exists to explain the reasoning that isn't recoverable from the code. Reference the issue. A commit should be one logical change — if the message needs \"and\", it's probably two commits."}, {"id": "2.9", "capability": "How would you amend the last commit message or add staged changes to it?", "title": "How would you amend the last commit message or add staged changes to it", "answer": "```bash\ngit commit --amend                    # edit message and/or include staged changes\ngit commit --amend --no-edit          # keep message, just add staged changes\n```\n\nAmend creates a *new* commit and discards the old one, so never amend something already pushed to a shared branch without understanding the force-push consequence."}, {"id": "2.10", "capability": "Why can amending a pushed commit cause problems for other people?", "title": "Why can amending a pushed commit cause problems for other people", "answer": "```bash\ngit commit --amend                    # edit message and/or include staged changes\ngit commit --amend --no-edit          # keep message, just add staged changes\n```\n\nAmend creates a *new* commit and discards the old one, so never amend something already pushed to a shared branch without understanding the force-push consequence."}, {"id": "2.11", "capability": "How would you explain what lives inside the `.git/` directory?", "title": "How would you explain what lives inside the `.git/` directory", "answer": "`objects/` (all content, as blobs/trees/commits/tags), `refs/` (branch and tag pointers), `HEAD` (pointer to current ref), `index` (the staging area, a binary file), `config` (local config), `logs/` (the reflog), `hooks/`. Deleting `.git/` turns the repo into a plain directory — everything Git knows lives there."}, {"id": "2.12", "capability": "What would happen if someone deleted `.git/`, and why?", "title": "What would happen if someone deleted `.git/`, and why", "answer": "`objects/` (all content, as blobs/trees/commits/tags), `refs/` (branch and tag pointers), `HEAD` (pointer to current ref), `index` (the staging area, a binary file), `config` (local config), `logs/` (the reflog), `hooks/`. Deleting `.git/` turns the repo into a plain directory — everything Git knows lives there."}, {"id": "2.13", "capability": "How would you explain Git objects: blob, tree, commit, and tag?", "title": "How would you explain Git objects: blob, tree, commit, and tag", "answer": "Four types, all content-addressed by SHA:\n- **Blob** — file contents. No name, no metadata.\n- **Tree** — a directory listing: names, modes, and pointers to blobs and other trees.\n- **Commit** — a pointer to one tree (the full snapshot), plus parent commit(s), author, committer, message.\n- **Tag** — an annotated tag object pointing at a commit, with its own message and signature.\n\nKey insight: Git stores **snapshots, not diffs**. Diffs are computed on demand. Identical content anywhere in history is stored once, because the SHA is the same. Inspect with `git cat-file -p <sha>`."}, {"id": "2.14", "capability": "How would you inspect a Git object directly and prove that Git stores snapshots, not just diffs?", "title": "How would you inspect a Git object directly and prove that Git stores snapshots, not just diffs", "answer": "Four types, all content-addressed by SHA:\n- **Blob** — file contents. No name, no metadata.\n- **Tree** — a directory listing: names, modes, and pointers to blobs and other trees.\n- **Commit** — a pointer to one tree (the full snapshot), plus parent commit(s), author, committer, message.\n- **Tag** — an annotated tag object pointing at a commit, with its own message and signature.\n\nKey insight: Git stores **snapshots, not diffs**. Diffs are computed on demand. Identical content anywhere in history is stored once, because the SHA is the same. Inspect with `git cat-file -p <sha>`."}]}, {"num": 3, "title": "Branching", "items": [{"id": "3.1", "capability": "How would you create, switch, rename, and delete Git branches?", "title": "How would you create, switch, rename, and delete Git branches", "answer": "```bash\ngit switch -c feature      # create and switch\ngit switch main            # switch\ngit branch -m old new      # rename\ngit branch -d feature      # delete (safe: refuses if unmerged)\ngit branch -D feature      # force delete\n```\n\n`-d` refusing on unmerged work is a feature, not an obstacle."}, {"id": "3.2", "capability": "Why does `git branch -d` refuse some deletes, and when would `-D` be appropriate?", "title": "Why does `git branch -d` refuse some deletes, and when would `-D` be appropriate", "answer": "```bash\ngit switch -c feature      # create and switch\ngit switch main            # switch\ngit branch -m old new      # rename\ngit branch -d feature      # delete (safe: refuses if unmerged)\ngit branch -D feature      # force delete\n```\n\n`-d` refusing on unmerged work is a feature, not an obstacle."}, {"id": "3.3", "capability": "How would you explain `git switch` and `git restore` compared with older `git checkout` usage?", "title": "How would you explain `git switch` and `git restore` compared with older `git checkout` usage", "answer": "`git checkout` was overloaded — it changed branches *and* discarded file changes, which meant a typo could destroy work. Git 2.23 split it: `switch` for branches, `restore` for files. `checkout` still works and you'll see it everywhere, but the split is clearer and safer."}, {"id": "3.4", "capability": "Why did Git split branch switching and file restoration into separate commands?", "title": "Why did Git split branch switching and file restoration into separate commands", "answer": "`git checkout` was overloaded — it changed branches *and* discarded file changes, which meant a typo could destroy work. Git 2.23 split it: `switch` for branches, `restore` for files. `checkout` still works and you'll see it everywhere, but the split is clearer and safer."}, {"id": "3.5", "capability": "How would you set a local branch to track a remote branch?", "title": "How would you set a local branch to track a remote branch", "answer": "```bash\ngit push -u origin feature       # push and set upstream\ngit branch -u origin/feature     # set upstream for existing branch\n```\n\nUpstream is what makes bare `git push` and `git pull` work, and what lets `git status` say \"ahead by 2 commits\"."}, {"id": "3.6", "capability": "What does an upstream branch change about `git status`, `git pull`, and `git push`?", "title": "What does an upstream branch change about `git status`, `git pull`, and `git push`", "answer": "```bash\ngit push -u origin feature       # push and set upstream\ngit branch -u origin/feature     # set upstream for existing branch\n```\n\nUpstream is what makes bare `git push` and `git pull` work, and what lets `git status` say \"ahead by 2 commits\"."}, {"id": "3.7", "capability": "How would you list merged and unmerged branches and prune stale remote references?", "title": "How would you list merged and unmerged branches and prune stale remote references", "answer": "```bash\ngit branch --merged main       # safe to delete\ngit branch --no-merged main\ngit fetch --prune              # remove local refs to deleted remote branches\n```\n\n`--merged` is relative to the branch you name — check against the right base. Note it reports false negatives for squash-merged branches, since the commits technically never merged."}, {"id": "3.8", "capability": "What can make `git branch --merged` misleading after squash merges?", "title": "What can make `git branch --merged` misleading after squash merges", "answer": "```bash\ngit branch --merged main       # safe to delete\ngit branch --no-merged main\ngit fetch --prune              # remove local refs to deleted remote branches\n```\n\n`--merged` is relative to the branch you name — check against the right base. Note it reports false negatives for squash-merged branches, since the commits technically never merged."}, {"id": "3.9", "capability": "How would you compare trunk-based development, GitFlow, and release branches?", "title": "How would you compare trunk-based development, GitFlow, and release branches", "answer": "- **Trunk-based** — short-lived branches (hours to a day), merge to main constantly, feature flags hide incomplete work. Requires good CI and test coverage. Best fit for continuous delivery.\n- **GitFlow** — develop/release/hotfix/feature branches. Heavy. Designed for versioned software with supported releases, not for services deploying multiple times a day.\n- **Release branches** — trunk plus a branch cut per release for stabilisation and backports.\n\nChoosing: the question is release model, not team size. If you deploy continuously, trunk-based; GitFlow's overhead buys you nothing and its long-lived branches actively fight integration. If you ship versioned artifacts customers install and you support old versions, release branches earn their cost."}, {"id": "3.10", "capability": "Given a team and release model, how would you choose a branching strategy and defend it?", "title": "Given a team and release model, how would you choose a branching strategy and defend it", "answer": "- **Trunk-based** — short-lived branches (hours to a day), merge to main constantly, feature flags hide incomplete work. Requires good CI and test coverage. Best fit for continuous delivery.\n- **GitFlow** — develop/release/hotfix/feature branches. Heavy. Designed for versioned software with supported releases, not for services deploying multiple times a day.\n- **Release branches** — trunk plus a branch cut per release for stabilisation and backports.\n\nChoosing: the question is release model, not team size. If you deploy continuously, trunk-based; GitFlow's overhead buys you nothing and its long-lived branches actively fight integration. If you ship versioned artifacts customers install and you support old versions, release branches earn their cost."}, {"id": "3.11", "capability": "How would you recognise a detached HEAD state?", "title": "How would you recognise a detached HEAD state", "answer": "HEAD points at a commit rather than a branch — happens when you check out a SHA or tag. Commits made here belong to no branch and will eventually be garbage collected. Recover with:\n\n```bash\ngit switch -c rescue-branch   # keep the work\ngit switch main               # discard it\n```\n\nIf you already left and lost the SHA, `git reflog` has it."}, {"id": "3.12", "capability": "If you made commits while detached, how would you keep or recover that work safely?", "title": "If you made commits while detached, how would you keep or recover that work safely", "answer": "HEAD points at a commit rather than a branch — happens when you check out a SHA or tag. Commits made here belong to no branch and will eventually be garbage collected. Recover with:\n\n```bash\ngit switch -c rescue-branch   # keep the work\ngit switch main               # discard it\n```\n\nIf you already left and lost the SHA, `git reflog` has it."}, {"id": "3.13", "capability": "How would you create and push Git tags?", "title": "How would you create and push Git tags", "answer": "```bash\ngit tag v1.0.0                        # lightweight: just a pointer\ngit tag -a v1.0.0 -m \"Release 1.0.0\"  # annotated: a real object\ngit push origin v1.0.0                # tags aren't pushed by default\n```\n\nAnnotated tags store tagger, date, message, and can be signed — use them for releases. Lightweight tags are fine as private bookmarks. Tags are meant to be immutable; moving a published tag breaks everyone who fetched it."}, {"id": "3.14", "capability": "How would you explain lightweight versus annotated tags, and which would you use for releases?", "title": "How would you explain lightweight versus annotated tags, and which would you use for releases", "answer": "```bash\ngit tag v1.0.0                        # lightweight: just a pointer\ngit tag -a v1.0.0 -m \"Release 1.0.0\"  # annotated: a real object\ngit push origin v1.0.0                # tags aren't pushed by default\n```\n\nAnnotated tags store tagger, date, message, and can be signed — use them for releases. Lightweight tags are fine as private bookmarks. Tags are meant to be immutable; moving a published tag breaks everyone who fetched it."}]}, {"num": 4, "title": "Merging & rebasing", "items": [{"id": "4.1", "capability": "How would you merge a branch and inspect the resulting Git history?", "title": "How would you merge a branch and inspect the resulting Git history", "answer": "`git merge feature` while on the target branch. A merge commit has two parents. `git log --graph --oneline` shows the topology. `git log --first-parent` follows only the mainline, which is often what you actually want on a busy repo."}, {"id": "4.2", "capability": "What does a merge commit with two parents tell you when reading `git log --graph`?", "title": "What does a merge commit with two parents tell you when reading `git log --graph`", "answer": "`git merge feature` while on the target branch. A merge commit has two parents. `git log --graph --oneline` shows the topology. `git log --first-parent` follows only the mainline, which is often what you actually want on a busy repo."}, {"id": "4.3", "capability": "How would you explain fast-forward versus `--no-ff` merges?", "title": "How would you explain fast-forward versus `--no-ff` merges", "answer": "If the target branch hasn't moved since the feature branched, Git just moves the pointer forward — no merge commit, linear history. `--no-ff` forces a merge commit anyway, which preserves the fact that a branch existed and groups its commits.\n\nForce fast-forward (`--ff-only`) when you want strictly linear history and want the merge to fail if a rebase is needed. Force `--no-ff` when the branch boundary is meaningful — it makes the whole feature revertable as one commit, which is a real operational advantage."}, {"id": "4.4", "capability": "When would you require `--ff-only`, and when would you deliberately force `--no-ff`?", "title": "When would you require `--ff-only`, and when would you deliberately force `--no-ff`", "answer": "If the target branch hasn't moved since the feature branched, Git just moves the pointer forward — no merge commit, linear history. `--no-ff` forces a merge commit anyway, which preserves the fact that a branch existed and groups its commits.\n\nForce fast-forward (`--ff-only`) when you want strictly linear history and want the merge to fail if a rebase is needed. Force `--no-ff` when the branch boundary is meaningful — it makes the whole feature revertable as one commit, which is a real operational advantage."}, {"id": "4.5", "capability": "How would you rebase a feature branch onto the latest main branch?", "title": "How would you rebase a feature branch onto the latest main branch", "answer": "```bash\ngit switch feature\ngit fetch origin\ngit rebase origin/main\n```\n\nReplays each of your commits on top of the new base, creating new commits with new SHAs. Result is linear history with no merge commit. If conflicts occur, resolve, `git add`, `git rebase --continue`."}, {"id": "4.6", "capability": "What happens to commit SHAs during a rebase, and how do you continue after conflicts?", "title": "What happens to commit SHAs during a rebase, and how do you continue after conflicts", "answer": "```bash\ngit switch feature\ngit fetch origin\ngit rebase origin/main\n```\n\nReplays each of your commits on top of the new base, creating new commits with new SHAs. Result is linear history with no merge commit. If conflicts occur, resolve, `git add`, `git rebase --continue`."}, {"id": "4.7", "capability": "How would you use interactive rebase to squash, fixup, reword, reorder, or drop commits?", "title": "How would you use interactive rebase to squash, fixup, reword, reorder, or drop commits", "answer": "```bash\ngit rebase -i HEAD~5\n```\n\nOpens an editor listing commits oldest-first. Actions: `pick` (keep), `reword` (change message), `edit` (stop to amend), `squash` (merge into previous, combine messages), `fixup` (merge into previous, discard message), `drop` (delete), and reorder by moving lines. `--autosquash` with commits made as `git commit --fixup=<sha>` automates the common case."}, {"id": "4.8", "capability": "When would `--autosquash` make an interactive rebase cleaner?", "title": "When would `--autosquash` make an interactive rebase cleaner", "answer": "```bash\ngit rebase -i HEAD~5\n```\n\nOpens an editor listing commits oldest-first. Actions: `pick` (keep), `reword` (change message), `edit` (stop to amend), `squash` (merge into previous, combine messages), `fixup` (merge into previous, discard message), `drop` (delete), and reorder by moving lines. `--autosquash` with commits made as `git commit --fixup=<sha>` automates the common case."}, {"id": "4.9", "capability": "What is the golden rule of rebasing?", "title": "What is the golden rule of rebasing", "answer": "Don't rebase commits that others have based work on. Rebasing rewrites SHAs; anyone who pulled the old commits now has divergent history and gets a mess on their next pull.\n\nWhen it's safe to break it: your own feature branch that nobody else is using, even if it's pushed — force-push with lease and carry on. Also fine if the whole team agrees and coordinates, though that's rarely worth it. The rule is really about *shared* branches, not *pushed* branches."}, {"id": "4.10", "capability": "When is it safe to rebase a pushed branch, and what must you do afterwards?", "title": "When is it safe to rebase a pushed branch, and what must you do afterwards", "answer": "Don't rebase commits that others have based work on. Rebasing rewrites SHAs; anyone who pulled the old commits now has divergent history and gets a mess on their next pull.\n\nWhen it's safe to break it: your own feature branch that nobody else is using, even if it's pushed — force-push with lease and carry on. Also fine if the whole team agrees and coordinates, though that's rarely worth it. The rule is really about *shared* branches, not *pushed* branches."}, {"id": "4.11", "capability": "How would you argue rebase versus merge for a 20-person engineering team?", "title": "How would you argue rebase versus merge for a 20-person engineering team", "answer": "The case for rebase/squash-merge: linear history, easy to read, `git bisect` works cleanly, each PR is one commit on main. The case for merge: preserves true history, no rewriting, no force-pushes, keeps the individual commits of a large change.\n\nA defensible position for that team size: rebase or squash *feature branches before merging*, but never rebase main. Squash-merge for small PRs; merge commits for large features where the individual commits carry real information. The important part is that it's enforced in branch protection rather than left to preference, because mixed strategies produce the worst of both."}, {"id": "4.12", "capability": "What branch protection or merge policy would you recommend to avoid mixed-history confusion?", "title": "What branch protection or merge policy would you recommend to avoid mixed-history confusion", "answer": "The case for rebase/squash-merge: linear history, easy to read, `git bisect` works cleanly, each PR is one commit on main. The case for merge: preserves true history, no rewriting, no force-pushes, keeps the individual commits of a large change.\n\nA defensible position for that team size: rebase or squash *feature branches before merging*, but never rebase main. Squash-merge for small PRs; merge commits for large features where the individual commits carry real information. The important part is that it's enforced in branch protection rather than left to preference, because mixed strategies produce the worst of both."}, {"id": "4.13", "capability": "How would you enable and use Git `rerere`?", "title": "How would you enable and use Git `rerere`", "answer": "\"Reuse recorded resolution.\" `git config --global rerere.enabled true`. Git records how you resolved a conflict and replays it automatically next time the same conflict appears. Valuable during long rebases and repeated merges of a long-lived branch. It's silently helpful, which is also its risk — it can apply a stale resolution, so review the result."}, {"id": "4.14", "capability": "What risk should you watch for when Git reuses a recorded conflict resolution?", "title": "What risk should you watch for when Git reuses a recorded conflict resolution", "answer": "\"Reuse recorded resolution.\" `git config --global rerere.enabled true`. Git records how you resolved a conflict and replays it automatically next time the same conflict appears. Valuable during long rebases and repeated merges of a long-lived branch. It's silently helpful, which is also its risk — it can apply a stale resolution, so review the result."}, {"id": "4.15", "capability": "How would you compare squash-merge and merge commits?", "title": "How would you compare squash-merge and merge commits", "answer": "Squash-merge collapses a PR into one commit on main. History is clean, but the individual commits are gone and the branch's relationship to main is lost — which is why `git branch --merged` won't list it.\n\nFor `git bisect`: squash-merge is actually *better*. Each commit on main is a complete, tested change, so bisect lands on a meaningful unit. With merge commits, bisect can land on an intermediate commit from inside a feature branch that never built on its own. `git bisect --first-parent` mitigates that."}, {"id": "4.16", "capability": "How do squash merges and merge commits affect `git bisect` and branch history?", "title": "How do squash merges and merge commits affect `git bisect` and branch history", "answer": "Squash-merge collapses a PR into one commit on main. History is clean, but the individual commits are gone and the branch's relationship to main is lost — which is why `git branch --merged` won't list it.\n\nFor `git bisect`: squash-merge is actually *better*. Each commit on main is a complete, tested change, so bisect lands on a meaningful unit. With merge commits, bisect can land on an intermediate commit from inside a feature branch that never built on its own. `git bisect --first-parent` mitigates that."}]}, {"num": 5, "title": "Conflict resolution", "items": [{"id": "5.1", "capability": "How do you read Git conflict markers and identify each side?", "title": "How do you read Git conflict markers and identify each side", "answer": "```\n<<<<<<< HEAD\nyour version\n=======\ntheir version\n>>>>>>> feature-branch\n```\n\nTop is the current branch (HEAD), bottom is what's being merged in. `git config merge.conflictStyle zdiff3` adds a third section showing the common ancestor, which usually makes the intent obvious and is worth enabling permanently."}, {"id": "5.2", "capability": "How does `merge.conflictStyle zdiff3` help when resolving conflicts?", "title": "How does `merge.conflictStyle zdiff3` help when resolving conflicts", "answer": "```\n<<<<<<< HEAD\nyour version\n=======\ntheir version\n>>>>>>> feature-branch\n```\n\nTop is the current branch (HEAD), bottom is what's being merged in. `git config merge.conflictStyle zdiff3` adds a third section showing the common ancestor, which usually makes the intent obvious and is worth enabling permanently."}, {"id": "5.3", "capability": "How would you resolve a conflict during a Git merge?", "title": "How would you resolve a conflict during a Git merge", "answer": "Edit the file, remove all markers, `git add <file>` to mark resolved, then `git commit`. `git status` lists unmerged paths. `git diff` during a conflict shows a combined diff against both parents."}, {"id": "5.4", "capability": "Which Git commands show unresolved paths and mark a merge conflict as resolved?", "title": "Which Git commands show unresolved paths and mark a merge conflict as resolved", "answer": "Edit the file, remove all markers, `git add <file>` to mark resolved, then `git commit`. `git status` lists unmerged paths. `git diff` during a conflict shows a combined diff against both parents."}, {"id": "5.5", "capability": "How would you resolve a conflict during a Git rebase?", "title": "How would you resolve a conflict during a Git rebase", "answer": "Same mechanics, but \"ours\" and \"theirs\" feel backwards. During a rebase, Git is replaying *your* commits onto the base branch — so at each step, \"ours\" is the base branch (the thing being replayed onto) and \"theirs\" is your commit. This trips people up constantly. Then `git add` and `git rebase --continue`."}, {"id": "5.6", "capability": "Why do `ours` and `theirs` feel inverted during a rebase conflict?", "title": "Why do `ours` and `theirs` feel inverted during a rebase conflict", "answer": "Same mechanics, but \"ours\" and \"theirs\" feel backwards. During a rebase, Git is replaying *your* commits onto the base branch — so at each step, \"ours\" is the base branch (the thing being replayed onto) and \"theirs\" is your commit. This trips people up constantly. Then `git add` and `git rebase --continue`."}, {"id": "5.7", "capability": "How would you abort a merge, rebase, or cherry-pick cleanly?", "title": "How would you abort a merge, rebase, or cherry-pick cleanly", "answer": "```bash\ngit merge --abort\ngit rebase --abort\ngit cherry-pick --abort\n```\n\nReturns to the state before you started. Safe, and the right instinct when a merge turns out to be much larger than expected."}, {"id": "5.8", "capability": "When should you stop and abort instead of continuing through a large conflict?", "title": "When should you stop and abort instead of continuing through a large conflict", "answer": "```bash\ngit merge --abort\ngit rebase --abort\ngit cherry-pick --abort\n```\n\nReturns to the state before you started. Safe, and the right instinct when a merge turns out to be much larger than expected."}, {"id": "5.9", "capability": "How would you use `checkout --ours` and `checkout --theirs` deliberately?", "title": "How would you use `checkout --ours` and `checkout --theirs` deliberately", "answer": "```bash\ngit checkout --ours <file>     # take current branch's version wholesale\ngit checkout --theirs <file>   # take incoming version wholesale\n```\n\nUse deliberately for files where merging line by line is meaningless — lockfiles, generated output, binary assets. Remember the inversion during rebase (5.3)."}, {"id": "5.10", "capability": "For which files is taking one whole side safer than line-by-line conflict resolution?", "title": "For which files is taking one whole side safer than line-by-line conflict resolution", "answer": "```bash\ngit checkout --ours <file>     # take current branch's version wholesale\ngit checkout --theirs <file>   # take incoming version wholesale\n```\n\nUse deliberately for files where merging line by line is meaningless — lockfiles, generated output, binary assets. Remember the inversion during rebase (5.3)."}, {"id": "5.11", "capability": "How would you use a merge tool or three-way diff view?", "title": "How would you use a merge tool or three-way diff view", "answer": "`git mergetool` launches a configured three-way diff (vimdiff, meld, VS Code, Beyond Compare). The three-way view — base, ours, theirs — is far more informative than the inline markers because you can see what each side actually changed relative to the ancestor."}, {"id": "5.12", "capability": "Why is a three-way conflict view more useful than inline conflict markers alone?", "title": "Why is a three-way conflict view more useful than inline conflict markers alone", "answer": "`git mergetool` launches a configured three-way diff (vimdiff, meld, VS Code, Beyond Compare). The three-way view — base, ours, theirs — is far more informative than the inline markers because you can see what each side actually changed relative to the ancestor."}, {"id": "5.13", "capability": "How would you resolve a conflict in a lockfile or generated file?", "title": "How would you resolve a conflict in a lockfile or generated file", "answer": "Don't hand-merge. Take one side, then regenerate:\n\n```bash\ngit checkout --theirs package-lock.json\nnpm install    # regenerate from package.json\ngit add package-lock.json\n```\n\nHand-merging a lockfile produces a file that's internally inconsistent and will fail in ways that are painful to debug. The same applies to any generated artifact — resolve the source, regenerate the output."}, {"id": "5.14", "capability": "Why is hand-merging generated output usually the wrong fix?", "title": "Why is hand-merging generated output usually the wrong fix", "answer": "Don't hand-merge. Take one side, then regenerate:\n\n```bash\ngit checkout --theirs package-lock.json\nnpm install    # regenerate from package.json\ngit add package-lock.json\n```\n\nHand-merging a lockfile produces a file that's internally inconsistent and will fail in ways that are painful to debug. The same applies to any generated artifact — resolve the source, regenerate the output."}]}, {"num": 6, "title": "Undo & recovery", "items": [{"id": "6.1", "capability": "How would you explain `git reset --soft`, `--mixed`, and `--hard` precisely?", "title": "How would you explain `git reset --soft`, `--mixed`, and `--hard` precisely", "answer": "All three move the branch pointer to the target commit. They differ in what else they touch:\n\n| Mode | Branch pointer | Index | Working directory |\n|---|---|---|---|\n| `--soft` | moved | unchanged | unchanged |\n| `--mixed` (default) | moved | reset | unchanged |\n| `--hard` | moved | reset | **overwritten** |\n\nSo `--soft HEAD~1` undoes the commit but leaves everything staged, ready to recommit. `--mixed HEAD~1` leaves changes unstaged. `--hard HEAD~1` destroys the changes. `--hard` is the only one that loses work."}, {"id": "6.2", "capability": "Which parts of Git state does each reset mode change: branch pointer, index, and working directory?", "title": "Which parts of Git state does each reset mode change: branch pointer, index, and working directory", "answer": "All three move the branch pointer to the target commit. They differ in what else they touch:\n\n| Mode | Branch pointer | Index | Working directory |\n|---|---|---|---|\n| `--soft` | moved | unchanged | unchanged |\n| `--mixed` (default) | moved | reset | unchanged |\n| `--hard` | moved | reset | **overwritten** |\n\nSo `--soft HEAD~1` undoes the commit but leaves everything staged, ready to recommit. `--mixed HEAD~1` leaves changes unstaged. `--hard HEAD~1` destroys the changes. `--hard` is the only one that loses work."}, {"id": "6.3", "capability": "How would you revert a commit on a shared branch?", "title": "How would you revert a commit on a shared branch", "answer": "```bash\ngit revert <sha>\n```\n\nCreates a *new* commit that undoes the change. History is preserved and nothing is rewritten, so collaborators are unaffected. Reset rewrites history, which on a shared branch means everyone else's next pull produces divergence and confusion. Rule: reset for local, revert for published.\n\nReverting a merge commit needs `-m 1` to specify which parent is the mainline. Note the follow-on trap: after reverting a merge, re-merging that branch won't reintroduce the changes, because Git considers them already merged. You have to revert the revert."}, {"id": "6.4", "capability": "Why should you use `git revert` instead of `git reset` for published history?", "title": "Why should you use `git revert` instead of `git reset` for published history", "answer": "```bash\ngit revert <sha>\n```\n\nCreates a *new* commit that undoes the change. History is preserved and nothing is rewritten, so collaborators are unaffected. Reset rewrites history, which on a shared branch means everyone else's next pull produces divergence and confusion. Rule: reset for local, revert for published.\n\nReverting a merge commit needs `-m 1` to specify which parent is the mainline. Note the follow-on trap: after reverting a merge, re-merging that branch won't reintroduce the changes, because Git considers them already merged. You have to revert the revert."}, {"id": "6.5", "capability": "How would you recover a lost commit or deleted branch using reflog?", "title": "How would you recover a lost commit or deleted branch using reflog", "answer": "```bash\ngit reflog\ngit switch -c recovered <sha>    # or git reset --hard <sha>\n```\n\nThe reflog records every position HEAD has held — commits, resets, rebases, checkouts — for around 90 days by default. It's local-only and it's why almost nothing in Git is truly lost. This is the first thing to reach for after any \"I've destroyed everything\" moment."}, {"id": "6.6", "capability": "Why is the reflog local-only, and what kind of Git mistakes can it recover from?", "title": "Why is the reflog local-only, and what kind of Git mistakes can it recover from", "answer": "```bash\ngit reflog\ngit switch -c recovered <sha>    # or git reset --hard <sha>\n```\n\nThe reflog records every position HEAD has held — commits, resets, rebases, checkouts — for around 90 days by default. It's local-only and it's why almost nothing in Git is truly lost. This is the first thing to reach for after any \"I've destroyed everything\" moment."}, {"id": "6.7", "capability": "How would you recover a deleted file from an earlier commit?", "title": "How would you recover a deleted file from an earlier commit", "answer": "```bash\ngit restore --source=<sha> -- path/to/file\ngit checkout <sha> -- path/to/file      # older syntax\n```\n\nTo find when it was deleted: `git log --diff-filter=D -- path/to/file`."}, {"id": "6.8", "capability": "How would you find the commit where a file was deleted before restoring it?", "title": "How would you find the commit where a file was deleted before restoring it", "answer": "```bash\ngit restore --source=<sha> -- path/to/file\ngit checkout <sha> -- path/to/file      # older syntax\n```\n\nTo find when it was deleted: `git log --diff-filter=D -- path/to/file`."}, {"id": "6.9", "capability": "How would you recover work after a bad `git reset --hard`?", "title": "How would you recover work after a bad `git reset --hard`", "answer": "If the work was **committed**, reflog has it (6.3). If it was **staged but not committed**, the blobs are still in the object database:\n\n```bash\ngit fsck --lost-found\n```\n\nwhich surfaces dangling blobs you can inspect with `git cat-file -p`. If it was **never staged**, it's gone — Git never saw it. That's the honest answer, and it's the argument for committing early and often, even if messily, since you can always tidy history later."}, {"id": "6.10", "capability": "When is uncommitted work unrecoverable, and what does that teach you about staging and committing?", "title": "When is uncommitted work unrecoverable, and what does that teach you about staging and committing", "answer": "If the work was **committed**, reflog has it (6.3). If it was **staged but not committed**, the blobs are still in the object database:\n\n```bash\ngit fsck --lost-found\n```\n\nwhich surfaces dangling blobs you can inspect with `git cat-file -p`. If it was **never staged**, it's gone — Git never saw it. That's the honest answer, and it's the argument for committing early and often, even if messily, since you can always tidy history later."}, {"id": "6.11", "capability": "How would you undo a bad rebase using `ORIG_HEAD` or reflog?", "title": "How would you undo a bad rebase using `ORIG_HEAD` or reflog", "answer": "```bash\ngit reset --hard ORIG_HEAD\n```\n\nGit sets `ORIG_HEAD` before dangerous operations. If that's been overwritten, find the pre-rebase commit in `git reflog` and reset to it."}, {"id": "6.12", "capability": "What would you do if `ORIG_HEAD` no longer points to the pre-rebase state?", "title": "What would you do if `ORIG_HEAD` no longer points to the pre-rebase state", "answer": "```bash\ngit reset --hard ORIG_HEAD\n```\n\nGit sets `ORIG_HEAD` before dangerous operations. If that's been overwritten, find the pre-rebase commit in `git reflog` and reset to it."}, {"id": "6.13", "capability": "How would you remove a leaked secret from Git history?", "title": "How would you remove a leaked secret from Git history", "answer": "Order matters: **rotate the secret first**. History rewriting doesn't help if the secret was ever pushed — assume it's compromised the moment it left your machine. Then clean:\n\n```bash\ngit filter-repo --path secrets.env --invert-paths\n```\n\nBlast radius: every commit after the touched one gets a new SHA, so everyone must re-clone or hard reset. Open PRs break. Forks keep the old objects. GitHub retains unreferenced commits accessible by SHA until support purges them. Tags need re-pointing. This is why rotation is the real fix and rewriting is cosmetic cleanup."}, {"id": "6.14", "capability": "Why is rotating the secret more important than rewriting Git history?", "title": "Why is rotating the secret more important than rewriting Git history", "answer": "Order matters: **rotate the secret first**. History rewriting doesn't help if the secret was ever pushed — assume it's compromised the moment it left your machine. Then clean:\n\n```bash\ngit filter-repo --path secrets.env --invert-paths\n```\n\nBlast radius: every commit after the touched one gets a new SHA, so everyone must re-clone or hard reset. Open PRs break. Forks keep the old objects. GitHub retains unreferenced commits accessible by SHA until support purges them. Tags need re-pointing. This is why rotation is the real fix and rewriting is cosmetic cleanup."}, {"id": "6.15", "capability": "How would you clean untracked files safely?", "title": "How would you clean untracked files safely", "answer": "```bash\ngit clean -n -d      # dry run — ALWAYS do this first\ngit clean -fd        # then actually delete\n```\n\n`-x` also removes ignored files, which will delete `node_modules`, `.env`, and build output. `git clean` is unrecoverable — these files were never in Git, so there's no reflog to save you."}, {"id": "6.16", "capability": "Why should `git clean -n` come before `git clean -fd`, and what extra risk does `-x` add?", "title": "Why should `git clean -n` come before `git clean -fd`, and what extra risk does `-x` add", "answer": "```bash\ngit clean -n -d      # dry run — ALWAYS do this first\ngit clean -fd        # then actually delete\n```\n\n`-x` also removes ignored files, which will delete `node_modules`, `.env`, and build output. `git clean` is unrecoverable — these files were never in Git, so there's no reflog to save you."}]}, {"num": 7, "title": "Inspection & investigation", "items": [{"id": "7.1", "capability": "How would you use `git log` flags to inspect history effectively?", "title": "How would you use `git log` flags to inspect history effectively", "answer": "```bash\ngit log --oneline --graph --decorate --all   # topology at a glance\ngit log --since=\"2 weeks ago\"\ngit log --author=\"jahid\"\ngit log -S \"functionName\"                    # commits where the count of this string changed\ngit log -G \"regex\"                           # commits whose diff matches the regex\ngit log -p -- path/to/file                   # patches for one file\ngit log --stat                               # files changed per commit\n```\n\n`-S` (the \"pickaxe\") is the one people don't know and it's excellent for \"when was this introduced\"."}, {"id": "7.2", "capability": "When would you use `git log -S` or `git log -G` instead of a plain log search?", "title": "When would you use `git log -S` or `git log -G` instead of a plain log search", "answer": "```bash\ngit log --oneline --graph --decorate --all   # topology at a glance\ngit log --since=\"2 weeks ago\"\ngit log --author=\"jahid\"\ngit log -S \"functionName\"                    # commits where the count of this string changed\ngit log -G \"regex\"                           # commits whose diff matches the regex\ngit log -p -- path/to/file                   # patches for one file\ngit log --stat                               # files changed per commit\n```\n\n`-S` (the \"pickaxe\") is the one people don't know and it's excellent for \"when was this introduced\"."}, {"id": "7.3", "capability": "How would you diff the working tree, index, HEAD, and another branch?", "title": "How would you diff the working tree, index, HEAD, and another branch", "answer": "```bash\ngit diff                    # working directory vs index\ngit diff --staged           # index vs HEAD\ngit diff HEAD               # working directory vs HEAD\ngit diff main..feature      # tip to tip\ngit diff main...feature     # feature vs their common ancestor\n```\n\nThe three-dot form is what code review shows — changes *on* the branch, excluding changes main made independently."}, {"id": "7.4", "capability": "What is the practical difference between two-dot and three-dot Git diffs?", "title": "What is the practical difference between two-dot and three-dot Git diffs", "answer": "```bash\ngit diff                    # working directory vs index\ngit diff --staged           # index vs HEAD\ngit diff HEAD               # working directory vs HEAD\ngit diff main..feature      # tip to tip\ngit diff main...feature     # feature vs their common ancestor\n```\n\nThe three-dot form is what code review shows — changes *on* the branch, excluding changes main made independently."}, {"id": "7.5", "capability": "How would you use `git blame` to trace where a line came from?", "title": "How would you use `git blame` to trace where a line came from", "answer": "```bash\ngit blame path/to/file\ngit blame -L 40,60 file           # limit to a line range\ngit blame -w -C file              # ignore whitespace, detect moved code\n```\n\n`-w -C` matters because a reformat commit otherwise makes every line blame to the person who ran the formatter. `--ignore-rev` and `.git-blame-ignore-revs` let you permanently exclude formatting commits."}, {"id": "7.6", "capability": "How can you avoid misleading blame results after formatting or moved-code commits?", "title": "How can you avoid misleading blame results after formatting or moved-code commits", "answer": "```bash\ngit blame path/to/file\ngit blame -L 40,60 file           # limit to a line range\ngit blame -w -C file              # ignore whitespace, detect moved code\n```\n\n`-w -C` matters because a reformat commit otherwise makes every line blame to the person who ran the formatter. `--ignore-rev` and `.git-blame-ignore-revs` let you permanently exclude formatting commits."}, {"id": "7.7", "capability": "How would you use `git bisect` to find the commit that introduced a bug?", "title": "How would you use `git bisect` to find the commit that introduced a bug", "answer": "```bash\ngit bisect start\ngit bisect bad                 # current commit is broken\ngit bisect good v1.2.0         # this one was fine\n# test, then mark each commit:\ngit bisect good | git bisect bad\ngit bisect reset               # when done\n```\n\nBinary search across history — 1000 commits takes about 10 tests. The main requirement is a reliable way to test each commit."}, {"id": "7.8", "capability": "What makes a good and bad commit useful when starting a bisect session?", "title": "What makes a good and bad commit useful when starting a bisect session", "answer": "```bash\ngit bisect start\ngit bisect bad                 # current commit is broken\ngit bisect good v1.2.0         # this one was fine\n# test, then mark each commit:\ngit bisect good | git bisect bad\ngit bisect reset               # when done\n```\n\nBinary search across history — 1000 commits takes about 10 tests. The main requirement is a reliable way to test each commit."}, {"id": "7.9", "capability": "How would you automate `git bisect` with `bisect run`?", "title": "How would you automate `git bisect` with `bisect run`", "answer": "```bash\ngit bisect run ./test-script.sh\n```\n\nScript exits 0 for good, non-zero for bad, 125 to skip an untestable commit. Fully automatic. This turns bisect from a tedious manual process into something you start and walk away from, and it's the version worth mentioning in an interview."}, {"id": "7.10", "capability": "What exit codes should a bisect test script return for good, bad, and skipped commits?", "title": "What exit codes should a bisect test script return for good, bad, and skipped commits", "answer": "```bash\ngit bisect run ./test-script.sh\n```\n\nScript exits 0 for good, non-zero for bad, 125 to skip an untestable commit. Fully automatic. This turns bisect from a tedious manual process into something you start and walk away from, and it's the version worth mentioning in an interview."}, {"id": "7.11", "capability": "How would you search Git history for when a string was added or removed?", "title": "How would you search Git history for when a string was added or removed", "answer": "`git log -S \"string\"` finds commits where the number of occurrences changed — i.e. where it was added or removed. `git log -G \"regex\"` finds commits whose diff text matches. Add `--all` to search every branch, and `-p` to see the actual change."}, {"id": "7.12", "capability": "How do `git log -S` and `git log -G` differ when investigating history?", "title": "How do `git log -S` and `git log -G` differ when investigating history", "answer": "`git log -S \"string\"` finds commits where the number of occurrences changed — i.e. where it was added or removed. `git log -G \"regex\"` finds commits whose diff text matches. Add `--all` to search every branch, and `-p` to see the actual change."}, {"id": "7.13", "capability": "How would you show a file history across renames?", "title": "How would you show a file history across renames", "answer": "```bash\ngit log --follow -- path/to/file\n```\n\nGit doesn't record renames; it infers them by content similarity. `--follow` enables that inference, which is why file history looks truncated without it."}, {"id": "7.14", "capability": "Why does Git infer renames instead of storing them directly?", "title": "Why does Git infer renames instead of storing them directly", "answer": "```bash\ngit log --follow -- path/to/file\n```\n\nGit doesn't record renames; it infers them by content similarity. `--follow` enables that inference, which is why file history looks truncated without it."}, {"id": "7.15", "capability": "How would you inspect an arbitrary Git object with `cat-file` or `show`?", "title": "How would you inspect an arbitrary Git object with `cat-file` or `show`", "answer": "```bash\ngit cat-file -t <sha>    # type\ngit cat-file -p <sha>    # pretty-print contents\ngit rev-parse HEAD       # resolve a ref to a SHA\ngit show <sha>           # commit with its diff\ngit ls-tree HEAD         # tree contents\n```\n\nUseful for understanding the object model concretely, and occasionally for recovering things."}, {"id": "7.16", "capability": "What commands would you use to identify an object type, print it, and resolve a ref to a SHA?", "title": "What commands would you use to identify an object type, print it, and resolve a ref to a SHA", "answer": "```bash\ngit cat-file -t <sha>    # type\ngit cat-file -p <sha>    # pretty-print contents\ngit rev-parse HEAD       # resolve a ref to a SHA\ngit show <sha>           # commit with its diff\ngit ls-tree HEAD         # tree contents\n```\n\nUseful for understanding the object model concretely, and occasionally for recovering things."}]}, {"num": 8, "title": "Remotes & collaboration", "items": [{"id": "8.1", "capability": "How would you add, rename, inspect, or change Git remotes?", "title": "How would you add, rename, inspect, or change Git remotes", "answer": "```bash\ngit remote -v\ngit remote add upstream git@github.com:org/repo.git\ngit remote rename origin old-origin\ngit remote set-url origin <new-url>\n```"}, {"id": "8.2", "capability": "How would you explain the difference between `origin` and `upstream` in a repo?", "title": "How would you explain the difference between `origin` and `upstream` in a repo", "answer": "```bash\ngit remote -v\ngit remote add upstream git@github.com:org/repo.git\ngit remote rename origin old-origin\ngit remote set-url origin <new-url>\n```"}, {"id": "8.3", "capability": "How would you explain `git fetch` versus `git pull`?", "title": "How would you explain `git fetch` versus `git pull`", "answer": "`fetch` downloads remote refs and objects but doesn't touch your working branch. `pull` is `fetch` plus an immediate `merge` (or `rebase`). Fetch-first is usually right because it lets you inspect what arrived — `git log HEAD..origin/main` — before deciding how to integrate it. `pull` on a branch with local commits is where surprise merge commits come from."}, {"id": "8.4", "capability": "Why is fetching first often safer than pulling immediately on a branch with local commits?", "title": "Why is fetching first often safer than pulling immediately on a branch with local commits", "answer": "`fetch` downloads remote refs and objects but doesn't touch your working branch. `pull` is `fetch` plus an immediate `merge` (or `rebase`). Fetch-first is usually right because it lets you inspect what arrived — `git log HEAD..origin/main` — before deciding how to integrate it. `pull` on a branch with local commits is where surprise merge commits come from."}, {"id": "8.5", "capability": "How would you configure `pull.rebase` and explain the choice?", "title": "How would you configure `pull.rebase` and explain the choice", "answer": "```bash\ngit config --global pull.rebase true\n```\n\nMakes `git pull` rebase your local commits on top of the fetched ones instead of merging. Produces linear history and avoids the noise of \"Merge branch 'main' of ...\" commits. The tradeoff is that it rewrites your local commits, so a conflict mid-pull is a rebase conflict. Setting `pull.ff only` is a defensible alternative: pull fails if a merge or rebase is needed, forcing you to decide explicitly."}, {"id": "8.6", "capability": "When would `pull.ff only` be a better default than automatic merge or rebase?", "title": "When would `pull.ff only` be a better default than automatic merge or rebase", "answer": "```bash\ngit config --global pull.rebase true\n```\n\nMakes `git pull` rebase your local commits on top of the fetched ones instead of merging. Produces linear history and avoids the noise of \"Merge branch 'main' of ...\" commits. The tradeoff is that it rewrites your local commits, so a conflict mid-pull is a rebase conflict. Setting `pull.ff only` is a defensible alternative: pull fails if a merge or rebase is needed, forcing you to decide explicitly."}, {"id": "8.7", "capability": "How would you force-push safely with `--force-with-lease`?", "title": "How would you force-push safely with `--force-with-lease`", "answer": "```bash\ngit push --force-with-lease\n```\n\n`--force` overwrites the remote branch unconditionally, including commits a colleague pushed while you were working. `--force-with-lease` checks that the remote is still where you last saw it and refuses if someone else pushed. It's the difference between \"overwrite\" and \"overwrite if nothing changed underneath me\". Always use the lease version. Note that a background `git fetch` (some IDEs do this) can update your remote-tracking ref and undermine the check — `--force-with-lease=<ref>:<sha>` is the paranoid form."}, {"id": "8.8", "capability": "How is `--force-with-lease` different from `--force`, and what edge case can weaken it?", "title": "How is `--force-with-lease` different from `--force`, and what edge case can weaken it", "answer": "```bash\ngit push --force-with-lease\n```\n\n`--force` overwrites the remote branch unconditionally, including commits a colleague pushed while you were working. `--force-with-lease` checks that the remote is still where you last saw it and refuses if someone else pushed. It's the difference between \"overwrite\" and \"overwrite if nothing changed underneath me\". Always use the lease version. Note that a background `git fetch` (some IDEs do this) can update your remote-tracking ref and undermine the check — `--force-with-lease=<ref>:<sha>` is the paranoid form."}, {"id": "8.9", "capability": "How would you recover after someone force-pushed over your work?", "title": "How would you recover after someone force-pushed over your work", "answer": "Your commits still exist locally. `git reflog` to find your pre-fetch position, or `origin/branch@{1}` in the reflog for the remote-tracking ref. Create a branch from that SHA, then rebase or cherry-pick onto the new remote state. If it's only on the remote, the pushed-but-orphaned commits may still be retrievable by SHA from the hosting provider's API."}, {"id": "8.10", "capability": "Where would you look locally for the old remote-tracking branch position?", "title": "Where would you look locally for the old remote-tracking branch position", "answer": "Your commits still exist locally. `git reflog` to find your pre-fetch position, or `origin/branch@{1}` in the reflog for the remote-tracking ref. Create a branch from that SHA, then rebase or cherry-pick onto the new remote state. If it's only on the remote, the pushed-but-orphaned commits may still be retrievable by SHA from the hosting provider's API."}, {"id": "8.11", "capability": "How would you clone a large repository shallowly or partially?", "title": "How would you clone a large repository shallowly or partially", "answer": "```bash\ngit clone --depth 1 <url>                 # shallow: only recent history\ngit clone --filter=blob:none <url>        # partial: blobs fetched on demand\ngit clone --single-branch --branch main <url>\n```\n\nShallow is standard in CI where history isn't needed — much faster, less disk. Tradeoffs: `git log` is truncated, `bisect` and `blame` are limited, and some operations trigger a fetch anyway. Partial clone (`blob:none`) is usually the better choice for large repos you'll actually work in, since history is intact and file contents arrive lazily. Deepen later with `git fetch --unshallow`."}, {"id": "8.12", "capability": "What tradeoffs do shallow and partial clones create for blame, bisect, log, and later fetches?", "title": "What tradeoffs do shallow and partial clones create for blame, bisect, log, and later fetches", "answer": "```bash\ngit clone --depth 1 <url>                 # shallow: only recent history\ngit clone --filter=blob:none <url>        # partial: blobs fetched on demand\ngit clone --single-branch --branch main <url>\n```\n\nShallow is standard in CI where history isn't needed — much faster, less disk. Tradeoffs: `git log` is truncated, `bisect` and `blame` are limited, and some operations trigger a fetch anyway. Partial clone (`blob:none`) is usually the better choice for large repos you'll actually work in, since history is intact and file contents arrive lazily. Deepen later with `git fetch --unshallow`."}, {"id": "8.13", "capability": "How would you work with a fork using `origin` and `upstream` remotes?", "title": "How would you work with a fork using `origin` and `upstream` remotes", "answer": "```bash\ngit clone git@github.com:you/repo.git\ngit remote add upstream git@github.com:org/repo.git\ngit fetch upstream\ngit rebase upstream/main       # or merge\ngit push origin feature\n```\n\n`origin` is your fork, `upstream` is the source. Keep your fork's main clean and unmodified — branch for every change — so syncing stays trivial."}, {"id": "8.14", "capability": "How would you keep your fork synced while keeping feature work isolated?", "title": "How would you keep your fork synced while keeping feature work isolated", "answer": "```bash\ngit clone git@github.com:you/repo.git\ngit remote add upstream git@github.com:org/repo.git\ngit fetch upstream\ngit rebase upstream/main       # or merge\ngit push origin feature\n```\n\n`origin` is your fork, `upstream` is the source. Keep your fork's main clean and unmodified — branch for every change — so syncing stays trivial."}]}, {"num": 9, "title": "Stash & housekeeping", "items": [{"id": "9.1", "capability": "How would you stash and reapply local work?", "title": "How would you stash and reapply local work", "answer": "```bash\ngit stash\ngit stash pop\n```\n\nSaves modified tracked files and reverts the working directory to HEAD. Stashes are stored as commits in `refs/stash`."}, {"id": "9.2", "capability": "What does Git store when you create a stash?", "title": "What does Git store when you create a stash", "answer": "```bash\ngit stash\ngit stash pop\n```\n\nSaves modified tracked files and reverts the working directory to HEAD. Stashes are stored as commits in `refs/stash`."}, {"id": "9.3", "capability": "How would you create a named stash and apply a specific stash entry?", "title": "How would you create a named stash and apply a specific stash entry", "answer": "```bash\ngit stash push -m \"wip: retry logic\"\ngit stash list\ngit stash apply stash@{2}\ngit stash show -p stash@{0}     # see the contents\n```\n\nMessage your stashes. `git stash list` showing five entries of \"WIP on main\" is useless."}, {"id": "9.4", "capability": "Why are named stashes easier to use than a list of default WIP messages?", "title": "Why are named stashes easier to use than a list of default WIP messages", "answer": "```bash\ngit stash push -m \"wip: retry logic\"\ngit stash list\ngit stash apply stash@{2}\ngit stash show -p stash@{0}     # see the contents\n```\n\nMessage your stashes. `git stash list` showing five entries of \"WIP on main\" is useless."}, {"id": "9.5", "capability": "How would you stash untracked files as well as tracked changes?", "title": "How would you stash untracked files as well as tracked changes", "answer": "```bash\ngit stash -u        # include untracked\ngit stash -a        # include ignored too\n```\n\nPlain `git stash` leaves untracked files in place, which surprises people — you switch branches and the new files are still sitting
